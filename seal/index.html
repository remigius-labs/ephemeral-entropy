  <script>
    let API = "https://api.blobscan.com/blobs/", SCAN = "https://blobscan.com", ETHERSCAN = "https://etherscan.io";
    async function chain() {
      try {
        const r = await fetch((window.EE_RELAY ? window.EE_RELAY + "/index.json" : "../index.json"), { cache: "no-store" });
        const j = await r.json();
        if (j.chainId === 11155111) { API = "https://api.sepolia.blobscan.com/blobs/"; SCAN = "https://sepolia.blobscan.com"; ETHERSCAN = "https://sepolia.etherscan.io"; }
      } catch {}
    }
    const GENESIS = 1606824023, SLOT = 12, EPOCH_SLOTS = 32, KEEP_EPOCHS = 4096;
    let MINTS = null;
    async function keptId(hash) {
      try {
        if (!MINTS) MINTS = (async () => {
          let contract = "0x9f0749bb1d015cdc982a53784d1b692ce5736e15";
          try { const j = await (await fetch(window.EE_RELAY + "/index.json", { cache: "no-store" })).json(); if (j.contract) contract = j.contract; } catch {}
          const rpc = (KEEP.rpc && KEEP.rpc[1]) || "https://ethereum-rpc.publicnode.com", out = []; let n = 0;
          for (let from = 1; from === 1 || from <= n; from += 100) {
            const body = from === 1 ? [{ jsonrpc: "2.0", id: 0, method: "eth_call", params: [{ to: contract, data: "0x18160ddd" }, "latest"] }] : [];
            for (let id = from; id < from + 100 && (from === 1 || id <= n); id++) body.push({ jsonrpc: "2.0", id, method: "eth_call", params: [{ to: contract, data: "0x86fe212d" + id.toString(16).padStart(64, "0") }, "latest"] });
            const res = await (await fetch(rpc, { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify(body) })).json();
            if (from === 1) { const t = res.find(r => r.id === 0); n = t && t.result ? parseInt(t.result, 16) : 0; }
            for (const r of res) if (r.id >= 1 && r.id <= n && r.result && r.result.length >= 194) out.push({ id: r.id, contract, ash: r.result.slice(2, 66), blob: "0x" + r.result.slice(66, 130) });
          }
          return out;
        })();
        const m = (await MINTS).find(x => x.blob.toLowerCase() === hash.toLowerCase());
        return m ? { id: m.id, contract: m.contract, ash: m.ash } : null;
      } catch { return null; }
    }
    function keptBar(host, k) {
      clearInterval(lifeTimer); if (!host.querySelector(".life")) host.innerHTML = BAR;
      host.querySelector(".life").classList.add("kept");
      host.querySelector(".kind").textContent = "NFT"; host.querySelector(".fg").style.width = "100%"; host.querySelector(".lt").textContent = "∞ token #" + k.id + " · kept forever";
    }
    let lifeTimer = null;
    const BAR = '<span class="life"><span class="kind">&nbsp;</span><span class="hb"><span class="fg"></span></span><span class="lt">&nbsp;</span></span>';
    const emptyBar = (host) => { clearInterval(lifeTimer); host.innerHTML = BAR; };
    function lifeBar(host, prune) {
      const E = SLOT * EPOCH_SLOTS, pruneEpoch = Math.floor((prune.getTime() / 1000 - GENESIS) / E);
      const left = () => Math.max(0, Math.min(KEEP_EPOCHS, pruneEpoch - Math.floor((Date.now() / 1000 - GENESIS) / E)));
      const rough = (n) => { const sec = n * E; return sec >= 86400 ? Math.round(sec / 86400) + " days" : sec >= 3600 ? Math.round(sec / 3600) + " hours" : sec > 0 ? Math.ceil(sec / 60) + " min" : "pruned"; };
      if (!host.querySelector(".life")) host.innerHTML = BAR;
      const fg = host.querySelector(".fg"), lt = host.querySelector(".lt"), hb = host.querySelector(".hb");
      let last = null;
      const tick = () => {
        const n = left(), w = n / KEEP_EPOCHS * 100;
        if (n === last) return;
        if (last !== null && n < last) { const h = document.createElement("span"); h.className = "hit"; h.style.left = w + "%"; h.style.width = Math.max((last - n) / KEEP_EPOCHS * 100, 0.6) + "%"; hb.appendChild(h); setTimeout(() => h.remove(), 1500); }
        last = n; fg.style.width = w.toFixed(3) + "%";
        { const l = Math.min(1, n * SLOT * EPOCH_SLOTS / 86400); fg.style.opacity = l.toFixed(3); document.getElementById("art").style.opacity = l.toFixed(3); }
        lt.textContent = rough(n) + " until forgotten"; host.querySelector(".kind").textContent = "Blob";
      };
      clearInterval(lifeTimer); tick(); lifeTimer = setInterval(tick, 1000);
    }
    function servedUntil(blockTime) {
      const slot = Math.floor((blockTime.getTime() / 1000 - GENESIS) / SLOT);
      const epoch = Math.floor(slot / EPOCH_SLOTS);
      return new Date((GENESIS + (epoch + KEEP_EPOCHS + 1) * EPOCH_SLOTS * SLOT) * 1000);
    }
    const seal = document.getElementById("seal");
    const art = document.getElementById("art");
    const sealbox = document.getElementById("sealbox");
    const status = document.getElementById("status");
    const lineEl = document.getElementById("line");
    const lblSeal = document.getElementById("lbl-seal"); lblSeal.style.transition = "opacity 500ms ease-out"; lblSeal.style.opacity = "0";
    const pair = document.getElementById("pair"), mintBack = document.getElementById("mintback"), scanBtn = document.getElementById("scanbtn");
    const long = (d) => d.toLocaleDateString("en-GB", { day: "numeric", month: "long", year: "numeric" });

    function hexToBytes(h) { return Uint8Array.from(h.slice(2).match(/../g).map(x => parseInt(x, 16))); }

    function toText(bytes) {
      let end = bytes.length;
      while (end > 0 && bytes[end - 1] === 0) end--;
      const raw = new TextDecoder("utf-8").decode(bytes.subarray(0, end));
      const lines = raw.replace(/\s+$/, "").split("\n").map(l => l.replace(/\s+$/, ""));
      const indent = Math.min(...lines.filter(l => l.trim()).map(l => l.match(/^ */)[0].length));
      return lines.map(l => l.slice(indent)).join("\n");
    }

    function fmt(d) { return d.toISOString().slice(0, 10); }
    function left(ms) {
      if (ms <= 0) return "archive copy";
      const d = Math.floor(ms / 864e5), h = Math.floor(ms % 864e5 / 36e5);
      return d > 0 ? `${d}d ${h}h` : `${h}h ${Math.floor(ms % 36e5 / 6e4)}m`;
    }

    async function show(hash) {
      emptyRun++;
      await chain();
      seal.textContent = "";
      art.setAttribute("hidden", ""); sealbox.hidden = false;
      status.textContent = ""; emptyBar(lineEl); pair.hidden = true; mintBack.hidden = true; lblSeal.style.opacity = "0";
      const KEPT = keptId(hash);
      let text, tx, copy = "", info = {};
      try {
        let data;
        [info, data] = await Promise.all([
          fetch(API + hash).then(r => r.ok ? r.json() : Promise.reject(r.status)),
          fetch(API + hash + "/data").then(r => r.ok ? r.json() : Promise.reject(r.status)),
        ]);
        const hex = typeof data === "string" ? data : data.data;
        text = toText(hexToBytes(hex));
        tx = (info.transactions || [])[0] || {};
      } catch (e) {
        if (!window.EE_RELAY) throw "unreachable";
        let r; try { r = await fetch(window.EE_RELAY + "/blob/" + hash, { cache: "no-store" }); } catch { throw "unreachable"; }
        if (!r.ok) throw (r.status === 404 ? 404 : "unreachable");
        const j = await r.json();
        text = j.seal; tx = { txHash: j.tx, blockNumber: j.block || null, blockTimestamp: j.timestamp ? j.timestamp * 1000 : null };
        copy = "relayer copy · blobscan is still indexing";
      }
      const at = tx.blockTimestamp ? new Date(tx.blockTimestamp) : null;
      const prune = at ? servedUntil(at) : null;
      const scanHref = ETHERSCAN + (tx.txHash ? "/tx/" + tx.txHash + "#blobs" : "/blob/" + hash);
      const alive = prune && prune > Date.now(), epochs = alive ? Math.max(0, Math.ceil((prune - Date.now()) / 1000 / (SLOT * EPOCH_SLOTS))) : 0;
      const kept = await KEPT;
      lblSeal.textContent = kept ? "Kept Seal · token #" + kept.id : "Seal in blob space"; lblSeal.style.opacity = "1";
      if (kept) keptBar(lineEl, kept);
      else if (alive) lifeBar(lineEl, prune);
      else if (prune) lineEl.innerHTML = 'Forgotten ' + prune.toLocaleDateString("en-GB", { day: "numeric", month: "short" }) + ' · <a class="look" href="https://blobscan.com/blob/' + hash + '" target="_blank" rel="noopener">look for it on Blobscan</a>';
      else lineEl.textContent = "Read from Ethereum's blob space";
      scanBtn.href = scanHref; let mine = null; try { mine = localStorage.getItem("ee.ash." + hash); } catch {}
      if (!mine && window.EEMine) { const r = EEMine.all().find(x => x.blobHash === hash.toLowerCase()); if (r) mine = r.ash; }
      scanBtn.hidden = !!kept;
      if (kept) { mintBack.textContent = "View on OpenSea"; mintBack.href = "https://opensea.io/assets/ethereum/" + kept.contract + "/" + kept.id; mintBack.target = "_blank"; mintBack.rel = "noopener"; mintBack.hidden = false; }
      else if (mine && /^[0-9a-f]{64}$/.test(mine)) { mintBack.textContent = "Mint"; mintBack.removeAttribute("target"); mintBack.href = "../write/" + location.search + "#" + mine; mintBack.hidden = false; }
      pair.classList.toggle("solo", mintBack.hidden || scanBtn.hidden); pair.hidden = false;
      status.textContent = "";
      const forgotten = !kept && prune && prune <= Date.now();
      art.classList.remove("dying"); art.style.opacity = "";
      const glyphs = forgotten ? Array.from({ length: 9 }, (_, r) => Array.from({ length: 9 }, (_, c) => (r === 4 && c === 4 ? CENTER : " "))) : gridFromText(text);
      if (glyphs) {
        art.removeAttribute("hidden");
        drawSeal(art, glyphs);
        fit(); await revealSeal(art, { mode: "bloom" });
        const k = kept && kept.ash ? kept.ash : hash.replace(/^0x/, "");
        lightSeal(art, Uint8Array.from(k.match(/../g).map(x => parseInt(x, 16))));
      } else {
        seal.textContent = text;
      }
    }

    function go(hash) {
      hash = (hash || "").trim().toLowerCase();
      if (!/^0x01[0-9a-f]{62}$/.test(hash)) { lineEl.textContent = ""; status.textContent = "Nothing here."; emptyBox(hash); return; }
      if (location.hash.slice(1) !== hash) history.replaceState(null, "", "#" + hash);
      show(hash).catch(e => {
        lineEl.textContent = "";
        status.innerHTML = e === 404 ? 'Nothing here. The network let it go, or it never was.' : 'Blob space did not answer.';
        emptyBox(hash);
      });
    }
    let emptyRun = 0;
    async function emptyBox(hash) {
      const me = ++emptyRun;
      const blank = Array.from({ length: 9 }, (_, r) => Array.from({ length: 9 }, (_, c) => (r === 4 && c === 4 ? CENTER : " ")));
      sealbox.hidden = false; seal.textContent = ""; art.removeAttribute("hidden");
      art.classList.remove("gone", "lit"); drawSeal(art, blank, { style: 2 });
      await revealSeal(art, { mode: "bloom" }); if (me !== emptyRun) return;
      await letGoSeal(art, 5000);
    }

    const fit = () => { const sb = sealbox; sb.style.removeProperty("--sealmax"); const over = document.documentElement.scrollHeight - innerHeight; if (over > 0) sb.style.setProperty("--sealmax", Math.max(160, sb.clientWidth - over) + "px"); };
    addEventListener("hashchange", () => go(location.hash.slice(1)));
