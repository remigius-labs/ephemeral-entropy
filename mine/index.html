<body>
  <div id="bg" aria-hidden="true"></div>
  <div class="scanlines" aria-hidden="true"></div>
  <h1 id="logo"><a href="../" class="home">Ephemeral Entropy</a></h1>
  <div id="said" aria-live="polite">&nbsp;</div>
  <div id="stage"></div>

  <script src="../fold2.js?v=2"></script>
  <script src="../shapes2.js?v=2"></script>
  <script src="../entropy.js?v=16"></script>
  <script src="../ee-config.js"></script>
  <script src="../mint.js?v=9"></script>
  <script src="../mine.js?v=1"></script>
  <script src="../corners.js?v=12" data-base="../"></script>
  <script>
  (() => {
    const RELAY = "https://relay.remi.gg", RPC = KEEP.rpc[1], CONTRACT = "0x9f0749bb1d015cdc982a53784d1b692ce5736e15";
    const NS = "http://www.w3.org/2000/svg", LIFE = 4097 * 384;
    const $ = (id) => document.getElementById(id);
    const bytes = (h) => Uint8Array.from(h.replace(/^0x/, "").match(/../g), x => parseInt(x, 16));
    const now = () => Date.now() / 1000;
    const pad = (n) => String(n).padStart(2, "0");
    const sp = () => 1;
    const loopOn = () => !matchMedia("(prefers-reduced-motion: reduce)").matches;

    let FIX = null;
    const fixture = async () => FIX || (FIX = await (await fetch("gallery.json", { cache: "no-store" })).json());
    async function readMints(contract) {
      const call = async (body) => (await fetch(RPC, { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify(body) })).json();
      const sel = (id) => ({ jsonrpc: "2.0", id, method: "eth_call", params: [{ to: contract, data: "0x86fe212d" + id.toString(16).padStart(64, "0") }, "latest"] });
      let n = 0; const out = [];
      for (let from = 1; from === 1 || from <= n; from += 100) {
        const batch = from === 1 ? [{ jsonrpc: "2.0", id: 0, method: "eth_call", params: [{ to: contract, data: "0x18160ddd" }, "latest"] }] : [];
        for (let id = from; id < from + 100 && (from === 1 || id <= n); id++) batch.push(sel(id));
        const res = await call(batch);
        if (!Array.isArray(res)) throw new Error("rpc");
        if (from === 1) { const t = res.find(r => r.id === 0); n = t && t.result ? parseInt(t.result, 16) : 0; }
        for (const r of res) {
          if (r.id < 1 || r.id > n || !r.result || r.result.length < 194) continue;
          out.push({ id: r.id, ash: r.result.slice(2, 66), blobHash: "0x" + r.result.slice(66, 130), expiry: parseInt(r.result.slice(130, 194), 16) });
        }
        if (!n) break;
      }
      return out.sort((a, b) => a.id - b.id);
    }
    function textGlyphs(hex) {
      const b = bytes(hex); let end = b.length; while (end > 0 && b[end - 1] === 0) end--;
      const lines = new TextDecoder("utf-8").decode(b.subarray(0, end)).replace(/\s+$/, "").split("\n").map(l => l.replace(/\s+$/, ""));
      const indent = Math.min(...lines.filter(l => l.trim()).map(l => l.match(/^ */)[0].length));
      return gridFromText(lines.map(l => l.slice(indent)).join("\n"));
    }
    const KEY = (h) => "ee.lab.glyphs." + h;
    async function blobGlyphs(hash, fresh) {
      if (!fresh) { try { const c = JSON.parse(localStorage.getItem(KEY(hash)) || "null"); if (c) return { g: c, from: "cache" }; } catch {} }
      try {
        const d = await (await fetch("https://api.blobscan.com/blobs/" + hash + "/data")).json();
        const g = textGlyphs(typeof d === "string" ? d : d.data);
        if (g) { try { localStorage.setItem(KEY(hash), JSON.stringify(g)); } catch {} return { g, from: "blobscan" }; }
      } catch {}
      try { const c = (await fixture()).casts.find(x => x.blobHash === hash); if (c && c.glyphs) return { g: c.glyphs, from: "fixture" }; } catch {}
      return { g: null, from: "none" };
    }
    let DATA = null, SORT = { key: "n", dir: -1 };
    const SNAP = "ee.gallery.snap";
    const snapRead = () => { try { return JSON.parse(localStorage.getItem(SNAP) || "null"); } catch { return null; } };
    const snapSave = (seals, mints) => { try { localStorage.setItem(SNAP, JSON.stringify({ casts: seals.map(x => ({ blobHash: x.blobHash, tx: x.tx, block: x.block, expiry: x.expiry, glyphs: x.glyphs })), mints })); } catch {} };
    async function quick() {
      const q = snapRead() || await fixture().catch(() => null);
      return q ? build({ seals: q.casts }, q.mints, "snapshot", false) : null;
    }
    function say(seals, got, of, src) {
      const kept = seals.filter(x => x.minted).length, el = document.getElementById("said"); if (!el) return;
      el.innerHTML = of && got < of ? "reading blob space · <b>" + got + "</b> of " + of
        : "<b>" + seals.length + "</b> Seals cast · <b>" + kept + "</b> kept · <b>" + seals.filter(x => !x.minted && x.expiry && x.expiry * 1000 < Date.now()).length + "</b> forgotten" + (src === "live" ? " · live from Ethereum" : " · checking Ethereum…");
    }
    async function load(fresh) {
      let idx, mints, src = "live";
      try {
        idx = await (await fetch(RELAY + "/index.json", { cache: "no-store" })).json();
        mints = await readMints(idx.contract || CONTRACT);
      } catch {
        const f = await fixture(); idx = { seals: f.casts }; mints = f.mints; src = "fixture";
      }
      const known = new Map();
      try { (await fixture()).casts.forEach(c => c.glyphs && known.set(c.blobHash.toLowerCase(), c.glyphs)); } catch {}
      (snapRead()?.casts || []).forEach(c => c.glyphs && known.set(c.blobHash.toLowerCase(), c.glyphs));
      if (!fresh) (idx.seals || []).forEach(c => { if (!c.glyphs && c.blobHash) { const g = known.get(c.blobHash.toLowerCase()); if (g) c.glyphs = g; } });
      const d = build(idx, mints, src, fresh);
      if (src === "live") Promise.all(d.seals.map(x => x.ready)).then(() => snapSave(d.seals, mints));
      return d;
    }
    function build(idx, mints, src, fresh) {
      const byHash = new Map(mints.map(m => [m.blobHash.toLowerCase(), m]));
      const casts = (idx.seals || []).filter(s => s.blobHash && s.expiry).sort((a, b) => (a.block || 0) - (b.block || 0) || a.expiry - b.expiry);
      for (const m of mints) if (!casts.some(c => c.blobHash.toLowerCase() === m.blobHash.toLowerCase())) casts.push({ blobHash: m.blobHash, expiry: m.expiry });
      const seals = casts.map((c, i) => {
        const m = byHash.get(c.blobHash.toLowerCase()) || null;
        const s = { n: i + 1, blobHash: c.blobHash, tx: c.tx, block: c.block, expiry: c.expiry, castAt: c.expiry - LIFE,
                    minted: m ? m.id : null, ash: m ? bytes(m.ash) : c.ash ? bytes(c.ash) : null, ashHex: m ? m.ash.replace(/^0x/, "") : c.ash || null, seed: bytes(c.blobHash), glyphs: null, from: null };
        if (!m && c.ash) { s.glyphs = FOLD2.grid(s.ash); s.from = "ash"; s.ready = Promise.resolve(s.glyphs); }
        if (m) { s.glyphs = FOLD2.grid(s.ash); s.from = "ash"; s.ready = Promise.resolve(s.glyphs); }
        else if (c.glyphs) { s.glyphs = c.glyphs; s.from = src === "live" ? "known" : src; s.ready = Promise.resolve(s.glyphs); }
        return s;
      });
      seals.forEach(s => { if (!s.ready && !s.minted && s.expiry && s.expiry * 1000 < Date.now()) { s.glyphs = blank(); s.from = "forgotten"; s.forgotten = true; s.ready = Promise.resolve(s.glyphs); } });
      const todo = seals.filter(s => !s.ready);
      const done = new Map(todo.map(s => { let r; const p = new Promise(res => r = res); s.ready = p; return [s, r]; }));
      (async () => {
        let k = 0;
        let got = 0;
        const worker = async () => { while (k < todo.length) { const s = todo[k++]; const { g, from } = await blobGlyphs(s.blobHash, fresh); s.glyphs = g; s.from = from; done.get(s)(g); got++; say(seals, got, todo.length, src); tag(); } };
        say(seals, 0, todo.length, src);
        await Promise.all([worker(), worker(), worker(), worker()]);
      })();
      return { seals, src, mints: mints.length };
    }

    function left(s) {
      const ms = (s.expiry - now()) * 1000;
      if (ms <= 0) return "pruned";
      const d = Math.floor(ms / 864e5), h = Math.floor(ms % 864e5 / 36e5), m = Math.floor(ms % 36e5 / 6e4);
      return d > 0 ? d + "d " + pad(h) + "h" : h + "h " + pad(m) + "m";
    }

    const EPOCH = 384, KEEP_EPOCHS = 4096;
    const GENESIS = 1606824023;
    const epochNow = () => Math.floor((now() - GENESIS) / EPOCH);
    const epochsLeft = (s) => Math.max(0, Math.min(KEEP_EPOCHS, Math.floor((s.expiry - GENESIS) / EPOCH) - epochNow()));
    const lifeLeft = (s) => epochsLeft(s) / KEEP_EPOCHS;
    const roughly = (s) => { const sec = epochsLeft(s) * EPOCH; return sec >= 86400 ? Math.round(sec / 86400) + " days" : sec >= 3600 ? Math.round(sec / 3600) + " hours" : sec > 0 ? Math.ceil(sec / 60) + " min" : "forgotten"; };
    const epText = (s) => epochsLeft(s) ? '<span class="td">' + roughly(s) + "</span>" : '<span class="td">forgotten</span><span class="eps">' + day(s.expiry) + "</span>";

          days.forEach(x => {
            const row = el("div", "day"), kept = x.s.filter(s => s.minted).length;
            row.append(el("div", "meta", "<b>" + x.d + "</b>" + x.s.length + " cast" + (kept ? ' · <span class="k">' + kept + " kept ✠</span>" : "")));
            const tiles = el("div", "row");
            x.s.forEach(s => { const c = el("div", "cell"); c.style.width = size + "px"; c.append(box(s, size), cap(s, size)); tiles.append(c); });
            row.append(tiles); g.append(row);
          });
          root.append(g);
        } },

      { k: "G", name: "scroll", desc: "<b>G · scroll</b>: C with one ledger column. the page scrolls, the grid of Seals stays put beside it.",
        run(root, seals) {
          const val = { n: x => x.n, minted: x => x.minted ? 2000 - x.minted : 0, cast: x => x.castAt || 0, light: x => -ROUTES.findIndex(q => q.name === routeOf(x)), life: x => x.minted ? Infinity : (x.expiry || 0) }[SORT.key];
          seals = seals.slice().sort((a, b) => (val(a) - val(b)) * SORT.dir || b.n - a.n); seals.forEach((x, k) => { x.at = k; });
          root.style.overflowY = "auto";
          const r = rect(root), g = el("div", "gc"), slim = narrow();
          g.style.alignItems = "flex-start";
          const L = ledger(seals, slim ? r.width : r.width * 0.56, 1e4, { m: "inf", thumbs: false, minRh: 26, maxRh: 30, fs: 0.78 });
          L.querySelectorAll("[title]").forEach(x => x.removeAttribute("title"));
          const gw = slim ? r.width : Math.min(r.width - L.__w - rem(2.4), r.height * 1.2);
          const f = fit(seals.length, gw, slim ? 1e4 : r.height - rem(4), 0, 8, slim ? 54 : 0, slim ? 70 : 170);
          const side = el("div"); side.style.cssText = "position:sticky;top:0;align-self:flex-start;display:flex;flex-direction:column;gap:0;align-items:stretch";
          const grid = el("div", "grid"); grid.style.gridTemplateColumns = `repeat(${f.cols}, ${f.size}px)`; grid.style.gap = "8px";
          seals.forEach(x => { const b = box(x, f.size); b.dataset.n = x.n; grid.append(b); });
          const head = el("div", "lr head", "Your Seals · this browser + your wallet"); head.style.cssText = "display:flex;align-items:center;margin-bottom:2px;padding:0 0.1rem";
          side.append(head, grid); g.append(side, L); root.append(g);
          const more = el("div", "more"); document.getElementById("stage").appendChild(more);
          const hint = () => {
            const rows = [...L.querySelectorAll(".lr:not(.head)")], vb = root.getBoundingClientRect().bottom;
            const hidden = rows.filter(r => r.getBoundingClientRect().top > vb - 8).length;
            root.classList.toggle("fade", hidden > 0); more.textContent = hidden ? "↓ " + hidden + " more" : ""; more.style.opacity = hidden ? "1" : "0";
          };
          root.addEventListener("scroll", hint, { passive: true }); requestAnimationFrame(hint); setTimeout(hint, 400);
          linkHover(root);
          linkBlob(root);
        } },
    ];

    V.splice(0, V.length, ...V.filter(v => v.k === "G"));
    let cur = 0, live = null;
    function art() {
      const k = DATA.seals.filter(s => s.minted); if (!k.length || !("artFrom" in k[0])) return "";
      const c = k.filter(s => s.artFrom === "chain").length;
      return '<br><span class="' + (c === k.length ? "dim" : "src fx") + '">art ' + (c === k.length ? "tokenURI " + c + "/" + k.length : "ash fallback " + (k.length - c) + "/" + k.length) + "</span>";
    }
    function tag() { if (!document.getElementById("tag")) return;
      const v = V[cur]; if (!DATA) { $("tag").innerHTML = "<b>" + v.k + " · " + v.name + "</b> " + (cur + 1) + "/" + V.length + " · ←→"; return; }
      const read = DATA.seals.filter(s => s.from).length, froms = [...new Set(DATA.seals.map(s => s.from).filter(Boolean))].join(" + ");
      $("tag").innerHTML = "<b>" + v.k + " · " + v.name + "</b> " + (cur + 1) + "/" + V.length + " · ←→" + (v.nav ? " · " + v.nav : "") +
        '<br><span class="src' + (DATA.src === "fixture" ? " fx" : "") + '">' + DATA.src + "</span> · " + DATA.seals.length + " cast · " + DATA.mints + " minted" +
        '<br><span class="dim">glyphs ' + read + "/" + DATA.seals.length + " · " + froms + "</span>" + art();
    }
    function go(k) {
      LIGHT.length = 0; document.querySelectorAll("#stage > .more").forEach(m => m.remove());
      cur = (k + V.length) % V.length;
      if (live && live.stop) live.stop();
      const stage = $("stage"); stage.textContent = "";
      const root = el("div", "v"); stage.appendChild(root);

      if (!DATA) return;
      live = V[cur].run(root, DATA.seals) || null;
    }
    addEventListener("keydown", (e) => {
      if (e.target.tagName === "INPUT") e.target.blur();
      if (e.key === "ArrowRight") { e.preventDefault(); go(cur + 1); }
      else if (e.key === "ArrowLeft") { e.preventDefault(); go(cur - 1); }
      else if (/^[1-9]$/.test(e.key) && +e.key <= V.length) go(+e.key - 1);
      else if ((e.key === "ArrowDown" || e.key === "ArrowUp") && live && live.key) { e.preventDefault(); live.key(e.key === "ArrowDown" ? 1 : -1); }
    });
    let rs; addEventListener("resize", () => { clearTimeout(rs); rs = setTimeout(() => go(cur), 250); });
    go(cur);
    async function mineData() {
      const recs = window.EEMine ? EEMine.all() : [];
      let idx = { seals: [] }, mints = [];
      try { idx = await (await fetch(RELAY + "/index.json", { cache: "no-store" })).json(); mints = await readMints(idx.contract || CONTRACT); } catch {}
      const byBlob = new Map((idx.seals || []).map(x => [x.blobHash.toLowerCase(), x]));
      const casts = recs.map(r => Object.assign({ blobHash: r.blobHash, ash: r.ash, block: r.block, tx: r.tx }, byBlob.get(r.blobHash) || {}, { ash: r.ash }))
        .filter(c => c.expiry || mints.some(m => m.blobHash.toLowerCase() === c.blobHash));
      const who = await (window.eeConnected ? window.eeConnected().catch(() => null) : null);
      if (who && mints.length) {
        const body = mints.map(m => ({ jsonrpc: "2.0", id: m.id, method: "eth_call", params: [{ to: idx.contract || CONTRACT, data: "0x6352211e" + m.id.toString(16).padStart(64, "0") }, "latest"] }));
        try { const res = await (await fetch(RPC, { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify(body) })).json();
          for (const r of res) { if (!r.result || ("0x" + r.result.slice(-40)).toLowerCase() !== who.toLowerCase()) continue;
            const m = mints.find(x => x.id === r.id); if (m && !casts.some(c => c.blobHash === m.blobHash.toLowerCase())) casts.push({ blobHash: m.blobHash.toLowerCase(), expiry: m.expiry, ash: m.ash.replace(/^0x/, "") }); } } catch {}
      }
      const mine = mints.filter(m => casts.some(c => c.blobHash === m.blobHash.toLowerCase()));
      return build({ seals: casts }, mine, "live", false);
    }
    function sayMine(d) {
      const el = document.getElementById("said"); if (!el) return;
      const kept = d.seals.filter(x => x.minted).length;
      el.innerHTML = d.seals.length ? "<b>" + d.seals.length + "</b> " + (d.seals.length === 1 ? "Seal" : "Seals") + " · <b>" + kept + "</b> kept · <b>" + d.seals.filter(x => !x.minted && x.expiry && x.expiry * 1000 < Date.now()).length + "</b> forgotten · saved in this browser, open a Seal's link on another device to bring it there"
        : "No Seals in this browser yet";
    }
    (async () => {
      await document.fonts.ready;
      DATA = await mineData(); sayMine(DATA); CWS.clear();
      if (!DATA.seals.length) { const st = document.getElementById("stage"); st.innerHTML = '<div style="height:100%;display:flex;align-items:center;justify-content:center"><a class="corner ready" style="position:static;opacity:1" href="../write/">Write your first Seal</a></div>'; return; }
      go(cur);
    })();
    addEventListener("ee-wallet", () => location.reload());
  })();
  </script>
  <script>if (/^(localhost|127\.0\.0\.1)$/.test(location.hostname) && /[?&]nudge/.test(location.search)) { const s = document.createElement("script"); s.src = "/ee/nudge.js"; document.body.appendChild(s); }</script>
</body>
